[pytest]
# Scope collection to this assistant's own suite. Without this, a bare
# `pytest` run from the project root also recurses into generated_projects/
# - real, user-generated sub-applications the assistant writes there (see
# tools.py's launch_generated_app/create_project_zip). Each one commonly
# defines its own same-named top-level modules (e.g. "database.py"), which
# collide once more than one such project exists on disk at once (Python's
# module cache only holds one "database" module per test session), turning
# a routine regression run into a hard collection ERROR instead of a normal
# pass/fail. generated_projects/*/tests are still fully testable - the
# assistant's own run_pytest tool always passes an explicit target path
# (e.g. target="generated_projects/hrms/tests"), and an explicit path on
# the command line always overrides testpaths/norecursedirs.
testpaths = tests
norecursedirs = generated_projects .git venv __pycache__ dist
